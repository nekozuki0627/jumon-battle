<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>呪文詠唱バトル</title>
<style>
:root{
  --bg:#0b0918;
  --bg2:#161033;
  --panel:rgba(32,25,64,.78);
  --line:rgba(232,196,106,.28);
  --gold:#e8c46a;
  --gold-dim:#9c8446;
  --violet:#9b7cf5;
  --ember:#ff7a52;
  --ice:#6ec9f0;
  --ok:#7ee0a0;
  --ng:#ff5a7a;
  --text:#eae6f7;
  --text-dim:#a49dc4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:
    radial-gradient(ellipse 80% 55% at 50% -10%, #3a2a70 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 100%, #4a2350 0%, transparent 60%),
    linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  display:flex;justify-content:center;
  padding:16px 14px 40px;
}
.wrap{width:100%;max-width:640px}

/* ---- 共通パーツ ---- */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  backdrop-filter:blur(6px);
  box-shadow:0 12px 40px rgba(0,0,0,.45);
}
.btn{
  display:block;width:100%;
  padding:15px 18px;
  border-radius:11px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(155,124,245,.28),rgba(80,55,160,.30));
  color:var(--text);
  font-size:16px;font-weight:700;
  font-family:inherit;
  cursor:pointer;
  transition:transform .08s ease, filter .15s ease;
}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default;filter:none;transform:none}
.btn.gold{
  background:linear-gradient(180deg,rgba(232,196,106,.9),rgba(180,140,60,.85));
  color:#2a1f06;border-color:rgba(255,230,160,.6);
}
.btn.ghost{background:rgba(255,255,255,.05);font-weight:600;font-size:14px;padding:11px}
.btn+.btn{margin-top:10px}
h1,h2,h3{margin:0}
.mono-num{font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---- タイトル ---- */
#title{text-align:center;padding-top:6vh}
.crest{font-size:52px;line-height:1;filter:drop-shadow(0 0 18px rgba(232,196,106,.55))}
.title-jp{
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:34px;font-weight:700;letter-spacing:.18em;
  margin:14px 0 6px;
  background:linear-gradient(180deg,#fff5d6,#e8c46a 55%,#a5813a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.title-sub{color:var(--text-dim);font-size:12.5px;letter-spacing:.32em;margin-bottom:26px}
.mode-desc{font-size:12px;color:var(--text-dim);font-weight:500;margin-top:4px;letter-spacing:.02em}
.btn.gold .mode-desc{color:rgba(42,31,6,.72)}
.notice{
  margin-top:18px;font-size:12px;line-height:1.75;color:var(--text-dim);
  border-top:1px solid rgba(255,255,255,.08);padding-top:14px;text-align:left;
}
.notice b{color:var(--gold)}
#micWarn{
  margin-top:14px;padding:11px 13px;border-radius:10px;
  background:rgba(255,90,122,.12);border:1px solid rgba(255,90,122,.4);
  font-size:12.5px;line-height:1.7;text-align:left;
}

/* ---- HPバー ---- */
.fighters{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.fighter{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.fighter.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,196,106,.35),0 0 22px rgba(232,196,106,.18)}
.f-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.f-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-hp{font-size:12px;color:var(--text-dim);white-space:nowrap}
.bar{height:8px;border-radius:4px;background:rgba(0,0,0,.42);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .45s cubic-bezier(.2,.9,.3,1)}
.hp-me>i{background:linear-gradient(90deg,#4fd18b,#7ee0a0)}
.hp-foe>i{background:linear-gradient(90deg,#c0392b,#ff7a52)}
.f-art{width:30px;height:30px;display:block;flex:none}
.f-art svg{width:100%;height:100%;display:block}
.foe-portrait{width:86px;height:86px;margin:0 auto 8px;filter:drop-shadow(0 8px 20px rgba(255,90,60,.4))}
.foe-portrait svg{width:100%;height:100%;display:block}

/* ---- 呪文選択 ---- */
.sect-label{font-size:11.5px;letter-spacing:.22em;color:var(--gold-dim);font-weight:700;margin:0 0 9px 2px}
.spell-pick{
  width:100%;text-align:left;padding:13px 15px;margin-bottom:9px;
  border-radius:11px;border:1px solid var(--line);
  background:linear-gradient(135deg,rgba(155,124,245,.16),rgba(40,28,90,.5));
  color:var(--text);font-family:inherit;cursor:pointer;
  transition:transform .08s, border-color .15s, filter .15s;
}
.spell-pick:hover{border-color:var(--gold);filter:brightness(1.12)}
.spell-pick:active{transform:translateY(1px)}
.sp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.sp-rank{font-size:10.5px;letter-spacing:.14em;font-weight:800;padding:2.5px 8px;border-radius:99px}
.r1{background:rgba(110,201,240,.18);color:var(--ice);border:1px solid rgba(110,201,240,.4)}
.r2{background:rgba(155,124,245,.2);color:#b9a3ff;border:1px solid rgba(155,124,245,.45)}
.r3{background:rgba(255,122,82,.18);color:var(--ember);border:1px solid rgba(255,122,82,.45)}
.sp-dmg{font-size:11.5px;color:var(--text-dim)}
.sp-text{
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:16px;line-height:1.5;letter-spacing:.03em;
}

/* ---- 詠唱 ---- */
#chantBox{text-align:center}
.chant-label{font-size:11.5px;letter-spacing:.22em;color:var(--gold-dim);font-weight:700;margin-bottom:12px}
.chant-text{
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:23px;line-height:1.62;letter-spacing:.04em;
  padding:16px 8px 8px;
  text-shadow:0 0 26px rgba(232,196,106,.4);
}
.chant-read{
  font-size:13px;line-height:1.7;color:var(--gold);opacity:.72;
  letter-spacing:.06em;padding:0 8px 10px;
}
.chant-warn{
  font-size:12.5px;font-weight:700;letter-spacing:.06em;
  color:var(--ember);margin-bottom:14px;
}
.sp-read{
  font-size:11.5px;line-height:1.6;color:var(--text-dim);
  letter-spacing:.04em;margin-top:3px;
}
.timer{height:5px;border-radius:3px;background:rgba(0,0,0,.4);overflow:hidden;margin:4px 0 16px}
.timer>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ember));width:100%}
.mic-orb{
  width:96px;height:96px;border-radius:50%;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:38px;
  background:radial-gradient(circle at 50% 35%,rgba(155,124,245,.5),rgba(50,30,120,.6));
  border:1px solid var(--line);
}
.mic-orb.listening{animation:pulse 1.15s ease-in-out infinite;border-color:var(--gold)}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(232,196,106,.45);transform:scale(1)}
  50%{box-shadow:0 0 0 18px rgba(232,196,106,0);transform:scale(1.05)}
}
.heard{
  min-height:44px;font-size:15px;line-height:1.6;color:var(--ice);
  padding:11px;border-radius:9px;background:rgba(0,0,0,.28);
  border:1px dashed rgba(110,201,240,.3);margin-bottom:14px;word-break:break-all;
  max-height:96px;overflow-y:auto;
}
.heard:empty::before{content:"…";color:var(--text-dim)}
#typeInput{
  width:100%;padding:13px;border-radius:10px;font-size:16px;font-family:inherit;
  background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);margin-bottom:11px;
}

/* ---- 敵の詠唱 ---- */
.foe-chant{
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:20px;line-height:1.62;letter-spacing:.04em;
  color:#ffb8a4;padding:14px 8px 6px;
  text-shadow:0 0 26px rgba(255,90,60,.45);
}
.foe-body{min-height:104px;display:flex;flex-direction:column;justify-content:center}
.opt-row{display:flex;gap:8px;margin-top:6px}
.opt-row .btn{margin-top:0;flex:1}
.dots{display:flex;gap:7px;justify-content:center}
.dots>i{
  width:7px;height:7px;border-radius:50%;background:var(--ember);
  animation:dots 1.1s ease-in-out infinite;
}
.dots>i:nth-child(2){animation-delay:.18s}
.dots>i:nth-child(3){animation-delay:.36s}
@keyframes dots{0%,100%{opacity:.22}50%{opacity:1}}

/* ---- 呪文づくり ---- */
.num-row{display:flex;gap:8px}
.num-btn{
  flex:1;padding:12px 0;border-radius:10px;font-size:16px;font-weight:800;font-family:inherit;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);cursor:pointer;
}
.num-btn.on{background:linear-gradient(180deg,rgba(232,196,106,.9),rgba(180,140,60,.85));color:#2a1f06}
.name-in{
  width:100%;padding:10px 12px;margin-bottom:7px;border-radius:9px;font-size:15px;font-family:inherit;
  background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);
}
.topic-jp{
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:25px;line-height:1.5;letter-spacing:.05em;color:var(--gold);
  padding:14px 4px 8px;text-shadow:0 0 26px rgba(232,196,106,.4);
}
.topic-note{font-size:12.5px;color:var(--text-dim);line-height:1.7}
.topic-label{font-size:11px;letter-spacing:.24em;color:var(--gold-dim);font-weight:700}
.topic-read{font-size:12.5px;color:var(--text-dim);letter-spacing:.06em;margin:-4px 0 12px}
.tech-tail{color:var(--gold);text-shadow:0 0 18px rgba(232,196,106,.5)}
.land.tech{border-style:double;border-width:3px;font-weight:700}
.pass-name{
  font-family:"Yu Mincho",serif;font-size:30px;letter-spacing:.1em;
  padding:12px 0 6px;color:var(--text);
}
.craft-line{
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:19px;line-height:1.6;letter-spacing:.03em;text-align:center;
  min-height:62px;                 /* flex にすると技名が別ブロック扱いで変な位置に折り返す */
  display:block;
  padding:16px 10px;border-radius:10px;background:rgba(0,0,0,.26);
  border:1px solid rgba(232,196,106,.18);
}
.craft-meta{font-size:11.5px;color:var(--text-dim);text-align:right;margin:6px 2px 10px}
.hand{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.wcard{
  position:relative;display:flex;flex-direction:column;align-items:stretch;gap:3px;
  padding:9px 10px 8px;border-radius:10px;text-align:left;cursor:pointer;
  background:linear-gradient(135deg,rgba(155,124,245,.14),rgba(40,28,90,.5));
  border:1px solid var(--line);color:var(--text);font-family:inherit;
  transition:transform .08s, border-color .15s, filter .15s, opacity .15s;
}
.wcard:active{transform:translateY(1px)}
.wcard.picked{border-color:var(--gold);background:linear-gradient(135deg,rgba(232,196,106,.24),rgba(90,60,20,.42))}
.wcard.tossed{opacity:.34;border-style:dashed;filter:grayscale(.6)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.card-k{font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px;flex:none;line-height:1.4}
.k呼{background:rgba(110,201,240,.18);color:var(--ice);border:1px solid rgba(110,201,240,.4)}
.k飾{background:rgba(155,124,245,.2);color:#b9a3ff;border:1px solid rgba(155,124,245,.45)}
.k命{background:rgba(255,122,82,.18);color:var(--ember);border:1px solid rgba(255,122,82,.45)}
.card-t{font-size:15.5px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;line-height:1.35}
.card-r{font-size:10px;color:var(--text-dim);line-height:1.3;letter-spacing:.02em}
.card-p{font-size:8.5px;color:var(--gold-dim);letter-spacing:.08em;flex:none}
.land-list{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0 14px}
.land{
  font-size:12.5px;padding:4px 9px;border-radius:99px;
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
}
.land.ok{background:rgba(126,224,160,.14);color:var(--ok);border:1px solid rgba(126,224,160,.35)}
.land.ng{background:rgba(255,90,122,.13);color:var(--ng);border:1px solid rgba(255,90,122,.38);text-decoration:line-through}
.draw-note{font-size:12px;color:var(--text-dim);line-height:1.7;margin-bottom:10px}
.draw-note b{color:var(--gold)}
.card-no{
  position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;
  background:var(--gold);color:#2a1f06;font-size:11.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.res-row{background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.res-row.top{border-color:var(--gold);background:rgba(232,196,106,.1)}
.res-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.res-name{font-size:14px;font-weight:700}
.res-total{font-size:20px;font-weight:900;color:var(--gold)}
.res-spell{font-family:"Yu Mincho",serif;font-size:14px;line-height:1.5;margin-top:5px;color:var(--text)}
.res-break{font-size:11px;color:var(--text-dim);margin-top:5px}
.final-list{margin-bottom:20px;text-align:left}

/* ---- 判定結果 ---- */
.verdict{text-align:center;padding:6px 0 2px}
.v-title{font-size:27px;font-weight:800;letter-spacing:.12em;margin-bottom:4px}
.v-crit{color:var(--gold);text-shadow:0 0 24px rgba(232,196,106,.7)}
.v-ok{color:var(--ok)}
.v-weak{color:var(--ice)}
.v-fail{color:var(--ng)}
.v-dmg{font-size:44px;font-weight:900;line-height:1.1;margin:2px 0 10px}
.acc-row{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text-dim);margin-bottom:6px}
.acc-bar{flex:1;height:7px;border-radius:4px;background:rgba(0,0,0,.42);overflow:hidden}
.acc-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold),var(--ok));transition:width .6s ease}
.v-heard{font-size:12.5px;color:var(--text-dim);margin-top:10px;line-height:1.7;text-align:left}
.v-heard b{color:var(--ice);font-weight:600}

/* ---- ログ ---- */
#log{margin-top:12px;font-size:12.5px;line-height:1.85;color:var(--text-dim);max-height:132px;overflow-y:auto}
#log div{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.05)}
#log b{color:var(--text)}

/* ---- 結果画面 ---- */
#over{text-align:center;padding-top:5vh}
.over-emoji{font-size:64px;line-height:1;margin-bottom:12px}
.over-title{font-family:"Yu Mincho",serif;font-size:30px;letter-spacing:.14em;margin-bottom:8px}
.over-sub{color:var(--text-dim);font-size:13.5px;line-height:1.8;margin-bottom:22px}
.stats{display:flex;gap:8px;margin-bottom:22px}
.stat{flex:1;background:rgba(0,0,0,.26);border:1px solid var(--line);border-radius:10px;padding:11px 6px}
.stat-v{font-size:21px;font-weight:800;color:var(--gold)}
.stat-l{font-size:10.5px;color:var(--text-dim);letter-spacing:.06em;margin-top:2px}

.shake{animation:shake .4s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(4px)}
}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ 合言葉ゲート ============ -->
<section id="gate">
  <div style="text-align:center;padding-top:12vh">
    <div class="crest">🗝️</div>
    <h1 class="title-jp" style="font-size:27px">封 印 の 扉</h1>
    <div class="title-sub">合言葉を告げよ</div>
    <div class="card">
      <input id="passIn" type="text" placeholder="あいことば" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false"
             style="width:100%;padding:14px;border-radius:10px;font-size:16px;font-family:inherit;
                    text-align:center;letter-spacing:.12em;
                    background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);margin-bottom:11px">
      <button class="btn gold" onclick="tryPass()">扉 を 開 く</button>
      <div id="passMsg" style="font-size:12.5px;color:var(--ng);min-height:20px;margin-top:10px"></div>
    </div>
  </div>
</section>

<!-- ============ タイトル ============ -->
<section id="title" class="hide">
  <div class="crest">🔮</div>
  <h1 class="title-jp">呪文詠唱バトル</h1>
  <div class="title-sub">SPELL CHANT BATTLE</div>

  <div class="card">
    <button class="btn gold" onclick="startGame('solo')">
      ひとり修行
      <div class="mode-desc">魔物3体と連戦。ギルドの試練に挑む</div>
    </button>
    <button class="btn" onclick="craftSetup()">
      呪文づくり
      <div class="mode-desc">3〜6人。手札10枚から最大5枚を選んで呪文を組み、唱えて投票で競う</div>
    </button>
    <button class="btn" onclick="startGame('duel')">
      ふたり対戦
      <div class="mode-desc">1台を交代で回す。先に相手のHPを削れ</div>
    </button>

    <div id="micWarn" class="hide"></div>

    <div class="notice">
      <b>遊びかた</b><br>
      どのモードも、やることは<b>呪文を声に出して唱える</b>こと。<br>
      正確さ × 速さで強さが決まる。噛むと失敗する。<br>
      <b>呪文づくり</b>は手札10枚から最大5枚を選んで呪文を組み、みんなの投票で競う。<b>言えなかった札は威力に数えない</b>。<br>
      <br>
      🎤 マイクの許可を求められたら「許可」を押してね。<br>
      声が出せない場所なら <b>タイピングモード</b> でも遊べるよ。
    </div>
  </div>
</section>

<!-- ============ バトル ============ -->
<section id="battle" class="hide">
  <div class="fighters" id="fighters">
    <div class="fighter" id="fL">
      <div class="f-top"><span class="f-art" id="eL"></span><span class="f-hp"><span id="hpLv">100</span>/<span id="hpLm">100</span></span></div>
      <div class="f-name" id="nL">あなた</div>
      <div class="bar hp-me"><i id="barL" style="width:100%"></i></div>
    </div>
    <div class="fighter" id="fR">
      <div class="f-top"><span class="f-art" id="eR"></span><span class="f-hp"><span id="hpRv">100</span>/<span id="hpRm">100</span></span></div>
      <div class="f-name" id="nR">敵</div>
      <div class="bar hp-foe"><i id="barR" style="width:100%"></i></div>
    </div>
  </div>

  <div class="card" id="stage"></div>

  <div id="log"></div>
</section>

<!-- ============ 結果 ============ -->
<section id="over" class="hide">
  <div class="over-emoji" id="ovEmoji">🏆</div>
  <div class="over-title" id="ovTitle"></div>
  <div class="over-sub" id="ovSub"></div>
  <div class="stats">
    <div class="stat"><div class="stat-v mono-num" id="stTurns">0</div><div class="stat-l">詠唱回数</div></div>
    <div class="stat"><div class="stat-v mono-num" id="stAcc">0%</div><div class="stat-l">平均精度</div></div>
    <div class="stat"><div class="stat-v mono-num" id="stCrit">0</div><div class="stat-l">会心の詠唱</div></div>
  </div>
  <div class="card">
    <button class="btn gold" onclick="location.reload()">もう一度</button>
  </div>
</section>

</div>
<script>
"use strict";

/* =========================================================
   呪文データ
   text : 画面に出す表記（＝音声認識が返しやすい標準的な漢字かな）

  const r = Math.random();
  let a, b, sep;
  if(r < 0.34)      { a = pick(TECH_KATA); b = pick(TECH_TAIL_KAN);  sep = "・"; }
  else if(r < 0.60) { a = pick(TECH_WA);   b = pick(TECH_TAIL_KAN);  sep = "の"; }

}

/* =========================================================
   文字列の正規化と類似度
   ========================================================= */
function norm(s){
  if(!s) return "";
  return s
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)) // カタカナ→ひらがな
    .replace(/[、。！？!?・「」『』…,.\sー　]/g, "")                        // 記号・空白・長音を除去
    .toLowerCase();
}

// 長い語から順に当てないと「我が」が「我」に食われる
const KANA_RE = new RegExp(
  Object.keys(KANA_MAP).sort((a,b)=>b.length-a.length)
    .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"), "g");

function kana(s){
  if(!s) return "";
  return norm(String(s).replace(KANA_RE, m => KANA_MAP[m]));
}
function lev(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
// 「えーっと」など余計な語が前後に混ざっても損をしないよう、
// 呪文と同じ長さの窓をずらして一番合う位置で採点する
function simOne(a,b){
  a=norm(a); b=norm(b);
  if(!a || !b) return 0;
  if(a.length <= b.length * 1.25) return 1 - lev(a,b)/Math.max(a.length,b.length);
  let best = 0;
  for(let i=0; i + b.length <= a.length; i++){
    const s = 1 - lev(a.substr(i, b.length), b)/b.length;
    if(s > best) best = s;
    if(best >= 0.99) break;
  }
  return best;
}
// 表記・読み・ゆれ候補それぞれについて、文字のまま／読みに揃えて の両方で比べ、
// 一番マシなスコアを採用する
function accuracy(heard, spell){
  const cands = [spell.text, spell.read, ...(spell.alt||[])];
  const hk = kana(heard);
  let best = 0;
  for(const c of cands){
    best = Math.max(best, simOne(heard, c), simOne(hk, kana(c)));
    if(best >= 0.995) break;
  }
  return best;
}

  stats:{turns:0, accSum:0, crit:0},
};

const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

/* =========================================================
   敵の読み上げ（ブラウザ内蔵の音声合成）
   ========================================================= */
const TTS = ("speechSynthesis" in window);
let voiceOn = true;
try{ voiceOn = localStorage.getItem("jumon_voice") !== "off"; }catch(e){}

let jaVoice = null;
function loadVoice(){
  if(!TTS) return;
  const vs = speechSynthesis.getVoices() || [];
  // 端末によって読み込みが遅れるので、来るたびに拾い直す
  const ja = vs.filter(v => /^ja([-_]|$)/i.test(v.lang));
  // 魔物なので男性寄りの声を優先。無い端末（Androidは1種類だけのことが多い）はそのまま
  jaVoice = ja.find(v => /ichiro|otoya|male|男/i.test(v.name)) || ja[0] || null;
}
if(TTS){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* 読み上げは一息で流すと完全な棒読みになる。句読点で区切って一節ずつ
   投げ、節が進むほど低く・遅くしていくと「溜めて言い切る」感じが出る。
   合成音声そのものの質は変えられないので、間の取り方で演技をつくる。 */
function speakFoe(text, profile, onend){
  if(!TTS || !voiceOn) return false;
  const p = profile || {pitch:1, rate:1};
  try{
    speechSynthesis.cancel();
    const parts = text.split(/[、。！?]/).map(s=>s.trim()).filter(Boolean);
    if(!parts.length) return false;

    parts.forEach((part, i) => {
      const last = (i === parts.length - 1);
      const u = new SpeechSynthesisUtterance(last ? part + "。" : part + "、");
      u.lang = "ja-JP";
      if(jaVoice) u.voice = jaVoice;
      // 言い切りに向けて少しずつ落として、最後の一節を重くする
      u.pitch = clamp(p.pitch - i * 0.05 - (last ? 0.10 : 0), 0, 2);
      u.rate  = clamp(p.rate  * (last ? 0.84 : 1 - i * 0.04), 0.1, 10);
      if(last){ u.onend = () => { stopDrone(); onend(); };
                u.onerror = () => { stopDrone(); onend(); }; }
      speechSynthesis.speak(u);
    });
    if(p.drone) startDrone(p.drone);
    return true;
  }catch(e){ return false; }
}
function stopSpeech(){
  stopDrone();
  if(TTS){ try{ speechSynthesis.cancel(); }catch(e){} }
}

/* 重い敵の声の下に低い唸りを重ねる。合成音声の平坦さが埋もれて、
   「機械が喋っている」感じがかなり薄れる。 */
let droneNodes = null;
function startDrone(freq){
  stopDrone();
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), o2 = actx.createOscillator();
    const f = actx.createBiquadFilter(), g = actx.createGain();
    o.type  = "sawtooth"; o.frequency.value  = freq;
    o2.type = "sine";     o2.frequency.value = freq * 0.5;
    f.type = "lowpass";   f.frequency.value  = freq * 5;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.linearRampToValueAtTime(0.05, actx.currentTime + 0.6);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(actx.destination);
    o.start(); o2.start();
    droneNodes = {o, o2, g};
  }catch(e){}
}
function stopDrone(){
  if(!droneNodes || !actx) { droneNodes = null; return; }
  const {o, o2, g} = droneNodes;
  droneNodes = null;
  try{
    const t = actx.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.35);
    o.stop(t + 0.4); o2.stop(t + 0.4);
  }catch(e){}
}

function toggleVoice(){
  voiceOn = !voiceOn;
  try{ localStorage.setItem("jumon_voice", voiceOn ? "on" : "off"); }catch(e){}
  if(!voiceOn) stopSpeech();
  showPick();
}

/* ---- 効果音（WebAudioの簡易シンセ） ---- */
let actx = null;
function beep(freq, dur, type="triangle", vol=0.14){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
const SFX = {
  crit(){ beep(880,.1); setTimeout(()=>beep(1320,.28,"sawtooth",.16),80); },
  hit(){  beep(420,.16,"square",.11); },
  weak(){ beep(260,.14,"sine",.1); },
  fail(){ beep(160,.4,"sawtooth",.13); },
  foe(){  beep(120,.3,"square",.1); },
};

/* =========================================================
   音声認識の可否チェック
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){
  G.typing = true;
  const w = $("micWarn");
  w.classList.remove("hide");
  w.innerHTML = "⚠️ このブラウザは音声認識に対応してないみたい。<b>タイピングモード</b>で起動するよ。<br>声で遊ぶなら PC の Chrome / Edge、Android の Chrome で開いてね。";
}

/* =========================================================
   進行
   ========================================================= */
function startGame(mode){
  G.mode = mode;
  G.stats = {turns:0, accSum:0, crit:0};
  G.stage = 0;
  G.L = {name: mode==="duel" ? "術士 1" : "あなた", art:"wizard1", hp:100, max:100};
  if(mode==="duel"){
    G.R = {name:"術士 2", art:"wizard2", hp:100, max:100};
  }else{
    setEnemy(0);
  }
  G.turn = 0;
  $("title").classList.add("hide");
  $("over").classList.add("hide");
  $("battle").classList.remove("hide");
  $("fighters").classList.remove("hide");
  $("log").innerHTML = "";
  logLine(mode==="duel" ? "⚔️ 詠唱決闘、開始！" : `⚔️ 第1の試練 ── ${G.R.name} が現れた！`);
  paint();
  showPick();
}

function setEnemy(i){
  const e = ENEMIES[i];
  G.R = {name:e.name, art:e.art, hp:e.hp, max:e.hp, atk:e.atk, spells:e.spells, voice:e.voice};
}

function paint(){
  $("nL").textContent = G.L.name; $("eL").innerHTML = ART[G.L.art] || "";
  $("nR").textContent = G.R.name; $("eR").innerHTML = ART[G.R.art] || "";
  $("hpLv").textContent = Math.max(0,Math.round(G.L.hp)); $("hpLm").textContent = G.L.max;
  $("hpRv").textContent = Math.max(0,Math.round(G.R.hp)); $("hpRm").textContent = G.R.max;
  $("barL").style.width = Math.max(0, G.L.hp/G.L.max*100) + "%";
  $("barR").style.width = Math.max(0, G.R.hp/G.R.max*100) + "%";
  $("fL").classList.toggle("active", G.turn===0);
  $("fR").classList.toggle("active", G.mode==="duel" && G.turn===1);
}

function logLine(html){
  const d = document.createElement("div");
  d.innerHTML = html;
  $("log").prepend(d);
}

const RANK_LABEL = {1:"階位 Ⅰ", 2:"階位 Ⅱ", 3:"奥　義"};
const RANK_DMG   = {1:"18", 2:"34", 3:"58"};

/* ---- 呪文3択 ---- */
function showPick(){
  G.busy = false;
  $("stage").onclick = null;
  const who = (G.mode==="duel") ? (G.turn===0 ? G.L.name : G.R.name) : "あなた";
  const cands = [
    pick(SPELLS.filter(s=>s.r===1)),
    pick(SPELLS.filter(s=>s.r===2)),
    pick(SPELLS.filter(s=>s.r===3)),
  ];
  let html = `<div class="sect-label">${who}の手番 ── 唱える呪文を選べ</div>`;
  cands.forEach((s,i)=>{
    html += `<button class="spell-pick" onclick="chooseSpell(${i})">
      <div class="sp-head">
        <span class="sp-rank r${s.r}">${RANK_LABEL[s.r]}</span>
        <span class="sp-dmg">最大 ${RANK_DMG[s.r]} ダメージ</span>
      </div>
      <div class="sp-text">${s.text}</div>
      <div class="sp-read">${s.read}</div>
    </button>`;
  });
  const opts = [];
  if(TTS && G.mode === "solo"){
    opts.push(`<button class="btn ghost" onclick="toggleVoice()">${voiceOn ? "🔊 敵の声：ON" : "🔇 敵の声：OFF"}</button>`);
  }
  if(!G.typing && SR){
    opts.push(`<button class="btn ghost" onclick="toTyping()">🎤 声が出せない → タイピング</button>`);
  }
  if(opts.length) html += `<div class="opt-row">${opts.join("")}</div>`;
  $("stage").innerHTML = html;
  G._cands = cands;
}
function toTyping(){ G.typing = true; logLine("⌨️ タイピングモードに切り替えた"); showPick(); }

/* ---- 詠唱画面 ---- */
let rec = null, tickTimer = null, startedAt = 0, stoppedAt = 0, settled = false;
let forceStop = false, restarts = 0;

// 録り直しをまたいだ聞き取り結果。つなげずに「録音ごとの結果」として持つ。
// Android は録り直すたびに直前のフレーズをもう一度返してくることがあり、
// 素直につなげると同じ文が積み上がって別物になってしまう。
// 判定は「各録音の結果」と「全部つなげたもの」の中で一番良かったものを採る。
let sessionTexts = [], curText = "";

// 録音をまたいで分断された場合につなげ直す。ただし Android は前の言葉を
// 丸ごと言い直してくるので、すでに含まれている分は捨てる。
// 「時」と「とき」のような表記ゆれも同じ言葉とみなすため、読みで比べる。
function joinSessions(list){
  const kept = [];
  for(const t of list){
    const k = kana(t);
    if(!k) continue;
    const raw = norm(t);
    // 読みに揃えた形・素のままの両方で見る。変換表に無い字が混ざっていても
    // 取りこぼさないようにするため
    const covered = (a, b) => kana(a).includes(kana(b)) || norm(a).includes(norm(b));
    if(kept.some(o => covered(o, t))) continue;                // 既出なら捨てる
    for(let i = kept.length - 1; i >= 0; i--){                 // 前のを含むなら差し替える
      if(covered(t, kept[i])) kept.splice(i, 1);
    }
    kept.push(t.trim());
  }
  return kept.join(" ");
}

function candidateTexts(){
  const all = sessionTexts.concat([curText]).filter(t => t && t.trim());
  if(all.length > 1){
    const joined = joinSessions(all);
    if(joined) all.push(joined);
  }
  return all;
}
function bestHeard(){
  let best = "", score = -1;
  for(const t of candidateTexts()){
    const s = accuracy(t, G._spell);
    if(s > score){ score = s; best = t; }
  }
  return { text: best, acc: Math.max(score, 0) };
}

// iOS の Safari は continuous 認識をまともに扱えず、一区切りごとに勝手に終わる。
// 判定はこちらで区切るので、端末側の都合で切れたら黙って録り直す。
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent)
            || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function chooseSpell(i){
  if(G.busy) return;
  G.busy = true;
  startChant(G._cands[i]);
}

// 呪文ひとつを唱えさせる。呪文づくりモードからも同じものを使う。
function startChant(s){
  stopSpeech();   // 敵の声が残っているとマイクがそれを拾ってしまう
  $("stage").onclick = null;
  G._spell = s;
  // 想定詠唱秒数（文字数ベース）＋余裕
  const chars = norm(s.text).length;
  G._par = Math.max(1.2, chars * 0.17);
  // タイピングは変換の手間があるので制限をたっぷり取る
  const limit = G.typing ? (G._par * 6 + 8) : (G._par * 2.4 + 2.0);
  G._limit = limit;

  $("stage").innerHTML = `
    <div id="chantBox">
      <div class="chant-label">${G.typing ? "この呪文を打ち込め" : "この呪文を声に出して唱えろ"}</div>
      <div class="chant-text">${s.text}</div>
      <div class="chant-read">${s.read}</div>
      <div class="chant-warn">${G.typing ? "全部そのまま打ち込め" : "途中で止めず、最後まで言い切れ"}</div>
      <div class="timer"><i id="tbar"></i></div>
      ${G.typing ? `
        <input id="typeInput" type="text" placeholder="呪文を入力…" autocomplete="off" autocapitalize="off">
        <button class="btn gold" onclick="submitTyping()">詠　唱</button>
      ` : `
        <div class="mic-orb" id="orb">🎤</div>
        <div class="heard" id="heard"></div>
        <button class="btn ghost" onclick="stopChant()">言い切った</button>
      `}
    </div>`;

  startedAt = performance.now();
  settled = false;
  forceStop = false;
  restarts = 0;
  stoppedAt = 0;
  sessionTexts = [];
  curText = "";

  // タイマーバー
  clearInterval(tickTimer);
  tickTimer = setInterval(()=>{
    const el = (performance.now()-startedAt)/1000;
    const w = Math.max(0, 100 - el/limit*100);
    const bar = $("tbar");
    if(bar) bar.style.width = w + "%";
    if(el >= limit) stopChant();
  }, 60);

  if(G.typing){
    const ti = $("typeInput");
    ti.focus();
    ti.addEventListener("keydown", e=>{ if(e.key==="Enter") submitTyping(); });
  }else{
    startListen();
  }
}

function startListen(){
  try{
    rec = new SR();
  }catch(e){
    G.typing = true; logLine("⚠️ マイクを起動できなかった。タイピングモードに切り替えるね"); showPick(); return;
  }
  rec.lang = "ja-JP";
  rec.interimResults = true;
  rec.continuous = !IS_IOS;
  rec.maxAlternatives = 4;

  const orb = $("orb");
  if(orb) orb.classList.add("listening");

  // Android の Chrome は「確定済みの文の一覧」を毎回まるごと送り直してくる。
  // 差分だけ足していくと同じ文が何度も積み上がって別物になるので、
  // 毎回 e.results から全文を組み直す（足し算しない）。
  rec.onresult = e => {
    // Android は「4」「4つ」「4つの」…と育っていく途中経過を並べて渡してくる。
    // 順に足すと同じ言葉が積み上がるので、含まれているものは捨てて一番長いものを残す。
    const finals = [], interims = [];
    for(let i=0; i<e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal){
        // 候補の中から呪文に一番近いものを採用（認識ゆれの救済）
        let best = r[0].transcript, bestS = accuracy(best, G._spell);
        for(let a=1; a<r.length; a++){
          const sc = accuracy(r[a].transcript, G._spell);
          if(sc > bestS){ bestS = sc; best = r[a].transcript; }
        }
        finals.push(best);
      }else{
        interims.push(r[0].transcript);
      }
    }
    const interim = interims.length ? joinSessions(interims) : "";
    curText = joinSessions(finals);
    const h = $("heard");
    if(h) h.textContent = curText + interim;
    // 十分な精度に達したら即確定（速さが得点になる）
    const live = curText + interim;
    if(Math.max(bestHeard().acc, accuracy(live, G._spell)) >= 0.92) stopChant();
  };
  rec.onerror = ev => {
    if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){
      cleanup();
      G.typing = true;
      logLine("🎤 マイクが許可されてないみたい。タイピングモードに切り替えるね");
      // 呪文づくりの途中なら、戦闘の呪文選択ではなく手札に戻す
      const back = G.chantDone ? craftRenderHand : showPick;
      G.chantDone = null;
      back();
    }
  };
  // 端末の都合で途中で切れたら、制限時間内なら黙って録り直す
  rec.onend = () => {
    if(settled) return;
    const elapsed = (performance.now() - startedAt)/1000;
    const enough  = bestHeard().acc >= 0.92;
    if(!forceStop && !enough && restarts < 5 && elapsed < G._limit - 0.4){
      restarts++;
      sessionTexts.push(curText);  // この録音の分を独立して確保する（つなげない）
      curText = "";
      try{ rec.start(); return; }catch(e){}
    }
    settle();
  };

  try{ rec.start(); }catch(e){}
}

function stopChant(){
  if(settled) return;
  forceStop = true;
  // Android は stop() から実際に終わるまで数秒かかることがある。
  // 速度点はここで止めた時刻で測らないと、待たされた分だけ損をする。
  if(!stoppedAt) stoppedAt = performance.now();
  if(rec){ try{ rec.stop(); }catch(e){} }
  else settle();
}

function cleanup(){
  settled = true;
  clearInterval(tickTimer);
  if(rec){ try{ rec.abort(); }catch(e){} rec = null; }
}

function submitTyping(){
  if(settled) return;
  const ti = $("typeInput");
  curText = ti ? ti.value : "";
  settle();
}

/* =========================================================
   判定
   ========================================================= */
function settle(){
  if(settled) return;
  const elapsed = ((stoppedAt || performance.now()) - startedAt)/1000;
  cleanup();

  const s = G._spell;
  const heard = bestHeard();
  const acc = heard.acc;

  // 呪文づくりモードは戦闘ではないので、結果だけ渡して抜ける
  if(G.chantDone){
    const cb = G.chantDone; G.chantDone = null;
    return cb({acc, elapsed, heard: heard.text, spell: s});
  }
  const base = {1:18, 2:34, 3:58}[s.r];

  // 速度ボーナス：想定より速ければ最大 ×1.35
  let speed = 1;
  if(acc >= 0.5 && !G.typing){
    speed = Math.max(0.85, Math.min(1.35, (G._par * 1.9) / Math.max(elapsed, .4)));
  }

  let verdict, cls, dmg, selfDmg = 0;
  if(acc >= 0.92){
    verdict = "会心の詠唱"; cls = "v-crit";
    dmg = base * 1.5 * speed; G.stats.crit++; SFX.crit();
  }else if(acc >= 0.75){
    verdict = "詠唱成功"; cls = "v-ok";
    dmg = base * (0.75 + acc*0.35) * speed; SFX.hit();
  }else if(acc >= 0.50){
    verdict = "不完全な詠唱"; cls = "v-weak";
    dmg = base * 0.45 * speed; SFX.weak();
  }else{
    verdict = "詠唱失敗…"; cls = "v-fail";
    dmg = 0; selfDmg = s.r * 5 + 3; SFX.fail();
  }
  dmg = Math.round(dmg);

  G.stats.turns++;
  G.stats.accSum += acc;

  // ダメージ適用
  const atkSide = G.turn === 0 ? "L" : "R";
  const defSide = G.turn === 0 ? "R" : "L";
  if(dmg > 0) G[defSide].hp -= dmg;
  if(selfDmg > 0) G[atkSide].hp -= selfDmg;

  const who = G.mode==="duel" ? (G.turn===0 ? G.L.name : G.R.name) : "あなた";
  logLine(selfDmg
    ? `<b>${who}</b> は詠唱に失敗し、反動で <b>${selfDmg}</b> のダメージ`
    : `<b>${who}</b> の「${s.text}」→ <b>${dmg}</b> ダメージ（精度 ${Math.round(acc*100)}%）`);

  const heardShown = heard.text.trim() || "（何も聞き取れなかった）";
  $("stage").innerHTML = `
    <div class="verdict">
      <div class="v-title ${cls}">${verdict}</div>
      <div class="v-dmg ${cls} mono-num">${selfDmg ? "−"+selfDmg+" 自傷" : dmg}</div>
      <div class="acc-row">
        <span>精度</span>
        <span class="acc-bar"><i id="accFill" style="width:0%"></i></span>
        <span class="mono-num">${Math.round(acc*100)}%</span>
      </div>
      <div class="acc-row"><span>詠唱時間</span><span style="flex:1"></span><span class="mono-num">${elapsed.toFixed(2)} 秒</span></div>
      <div class="v-heard">聞こえた言葉：<b>${escapeHtml(heardShown)}</b></div>
    </div>
    <button class="btn gold" style="margin-top:16px" id="nextBtn">つづける</button>`;

  requestAnimationFrame(()=>{ const f=$("accFill"); if(f) f.style.width = Math.round(acc*100)+"%"; });
  if(dmg > 0 || selfDmg > 0){
    const el = $(defSide==="R" ? "fR" : "fL");
    el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"), 420);
  }
  paint();
  $("nextBtn").onclick = afterTurn;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---- ターン終了後 ---- */
function afterTurn(){
  // 決着チェック
  if(G.R.hp <= 0){
    if(G.mode === "duel"){ return gameOver(true, `${G.L.name} の勝利！`); }
    G.stage++;
    if(G.stage >= ENEMIES.length) return gameOver(true, "");
    setEnemy(G.stage);
    logLine(`✨ 敵を打ち倒した！ 第${G.stage+1}の試練 ── <b>${G.R.name}</b> が現れた！`);
    G.L.hp = Math.min(G.L.max, G.L.hp + 25);
    logLine("🌿 休息をとり、HPが 25 回復した");
    paint(); return showPick();
  }
  if(G.L.hp <= 0){
    return gameOver(false, G.mode==="duel" ? `${G.R.name} の勝利！` : "");
  }

  if(G.mode === "duel"){
    G.turn = 1 - G.turn;
    paint();
    return showPick();
  }

  // ひとり修行：敵も詠唱してくる
  enemyTurn();
}

/* ---- 敵の詠唱 ---- */
function enemyTurn(){
  G.busy = true;
  const e   = G.R;
  const sp  = pick(e.spells);
  const crit = Math.random() < 0.18;
  const dmg = Math.round(rnd(e.atk[0], e.atk[1]) * (crit ? 1.6 : 1));
  let revealed = false, done = false, t1 = null, t2 = null;

  $("stage").innerHTML = `
    <div class="verdict">
      <div class="foe-portrait">${ART[e.art] || ""}</div>
      <div class="chant-label">${e.name}の詠唱</div>
      <div class="foe-chant">${sp}</div>
      <div class="foe-body" id="foeBody"><span class="dots"><i></i><i></i><i></i></span></div>
    </div>`;

  const reveal = () => {
    if(revealed) return;
    revealed = true;
    clearTimeout(t1);
    G.L.hp -= dmg;
    SFX.foe();
    $("foeBody").innerHTML =
      `<div class="v-title ${crit ? "v-crit" : "v-fail"}">${crit ? "渾身の一撃" : "直　撃"}</div>
       <div class="v-dmg ${crit ? "v-crit" : "v-fail"} mono-num">${dmg}</div>`;
    logLine(`🔥 <b>${e.name}</b> の「${sp}」→ <b>${dmg}</b> のダメージ${crit ? "（渾身の一撃）" : ""}`);
    paint();
    const el = $("fL");
    el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"), 420);
    t2 = setTimeout(advance, 1800);
  };
  const advance = () => {
    if(done) return;
    done = true;
    clearTimeout(t1); clearTimeout(t2);
    $("stage").onclick = null;
    stopSpeech();
    reveal();                       // まだ着弾していなければここで着弾させる
    if(G.L.hp <= 0) return gameOver(false, "");
    showPick();
  };

  // 読み上げが終わったら着弾。喋れない端末・音量オフでも進むよう保険を置く。
  const spoke = speakFoe(sp, e.voice, reveal);
  t1 = setTimeout(reveal, spoke ? Math.min(9000, sp.length * 260 + 2200) : 1150);
  // 「つづける」のクリックはこの直後に親まで上がってくる。ここで即座に
  // スキップ役を仕込むと、その一発で敵の詠唱が飛ばされてしまう。
  setTimeout(() => { if(!done) $("stage").onclick = advance; }, 300);
}

/* =========================================================
   合言葉ゲート
   身内向けの目隠し。ソースを読み解けば突破できる程度のもので、
   秘密を守る鍵ではない（ゲームなので実害なし）。
   ========================================================= */
function ph(s){
  let h = 2166136261 >>> 0;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619) >>> 0; }
  return h.toString(36);
}
const GATE_HASH = "1al2tjp";
const GATE_KEY  = "jumon_gate_v1";

function openGate(){
  $("gate").classList.add("hide");
  $("title").classList.remove("hide");
}
function tryPass(){
  const v = norm($("passIn").value || "");
  if(ph(v) === GATE_HASH){
    try{ localStorage.setItem(GATE_KEY, GATE_HASH); }catch(e){}
    beep(660,.1); setTimeout(()=>beep(990,.3,"triangle",.15),90);
    openGate();
  }else{
    $("passMsg").textContent = "扉は開かない。合言葉が違う。";
    $("gate").querySelector(".card").classList.add("shake");
    setTimeout(()=>$("gate").querySelector(".card").classList.remove("shake"), 420);
    SFX.fail();
  }
}
(function initGate(){
  let saved = null;
  try{ saved = localStorage.getItem(GATE_KEY); }catch(e){}
  if(saved === GATE_HASH){ openGate(); return; }
  const el = $("passIn");
  el.addEventListener("keydown", e=>{ if(e.key==="Enter") tryPass(); });
  setTimeout(()=>el.focus(), 200);
})();

/* =========================================================
   呪文づくりモード（1台を回して遊ぶ）
   手札から3枚選んで自分だけの呪文を組み、声に出して唱え、
   最後にみんなで投票する。
   ========================================================= */
const C = { players:[], round:0, rounds:3, tech:null, turn:0, order:[], entries:[], voter:0,
            hand:[], deck:[], chosen:[], discard:[], draws:0 };

const MAX_DRAWS  = 3;
const DRAW_MULT  = [1, 0.9, 0.8, 0.7];   // 粘るほど威力は落ちるが、罠にならない程度に
const MAX_PICK   = 5;                    // 唱えられる札の上限
const LAND_LINE  = 0.7;                  // この精度で「その札は唱えられた」とみなす
const curMult    = () => DRAW_MULT[Math.min(C.draws, MAX_DRAWS)];
const curPlayer  = () => C.order[C.turn];

/* 札ごとに「ちゃんと言えたか」を見る。
   呪文全体をひとまとめに比べると、長い呪文ほど1語の噛みが薄まって
   有利になってしまう（実測：1枚なら0%、10枚なら87%）。
   札単位で見れば、長い呪文は落とす札が増えるぶん本当に不利になる。 */
function landedCards(heard, cards){
  const hk = kana(heard), hn = norm(heard);
  return cards.map(c => Math.max(
    simOne(hn, norm(c.t)), simOne(hk, kana(c.t)), simOne(hk, kana(c.r))
  ) >= LAND_LINE);
}

function craftSetup(){
  $("title").classList.add("hide");
  $("over").classList.add("hide");
  $("battle").classList.remove("hide");
  $("fighters").classList.add("hide");
  $("log").innerHTML = "";
  const n = Math.max(3, C.players.length || 3);
  $("stage").innerHTML = `
    <div class="sect-label">何人で遊ぶ？</div>
    <div class="num-row">${[3,4,5,6].map(i=>
      `<button class="num-btn ${i===n?'on':''}" onclick="craftSetPlayers(${i})">${i}</button>`).join("")}</div>
    <div class="draw-note" style="margin-top:9px">投票で競うので3人から。ふたりなら「ふたり対戦」へ。</div>
    <div class="sect-label" style="margin-top:14px">名前（そのままでもOK）</div>
    <div id="nameList"></div>
    <button class="btn gold" style="margin-top:12px" onclick="craftBegin()">はじめる</button>
    <button class="btn ghost" style="margin-top:8px" onclick="location.reload()">もどる</button>`;
  craftSetPlayers(n);
}
function craftSetPlayers(n){
  const old = C.players.map(p=>p.name);
  C.players = Array.from({length:n}, (_,i)=>({ name: old[i] || `術士 ${i+1}`, score:0 }));
  document.querySelectorAll(".num-btn").forEach(b=>b.classList.toggle("on", +b.textContent===n));
  $("nameList").innerHTML = C.players.map((p,i)=>
    `<input class="name-in" value="${escapeHtml(p.name)}" maxlength="8"
       oninput="C.players[${i}].name=this.value.slice(0,8)">`).join("");
}
function craftBegin(){
  C.players.forEach((p,i)=>{ if(!p.name.trim()) p.name = `術士 ${i+1}`; p.score = 0; });
  C.round = 0;
  craftRound();
}

function craftRound(){
  C.round++;
  C.tech = makeTech();
  C.turn = 0;
  C.entries = [];
  C.voter = 0;
  // 後の人ほど他人の呪文を聞いてから作れて有利なので、幕ごとに先攻をずらす
  const n = C.players.length;
  C.order = Array.from({length:n}, (_,i)=>(i + C.round - 1) % n);
  const last = C.round === C.rounds;
  $("stage").onclick = null;
  $("stage").innerHTML = `
    <div class="verdict">
      <div class="sect-label">第 ${C.round} 幕 ／ 全 ${C.rounds} 幕${last ? "　── 終幕" : ""}</div>
      <div class="topic-label">この幕の決め台詞</div>
      <div class="topic-jp">${C.tech.t}</div>
      <div class="topic-read">${C.tech.r}</div>
      <div class="topic-note">
        手札10枚。いらない札は3回まで引き直せる。<br>
        <b>最大5枚</b>を選んで呪文を組み、<b>最後にこの技名で締めろ</b>。<br>
        言えなかった札は威力に数えない。全部言い切れば +20。<br>
        ${last ? '<b style="color:var(--ember)">終幕は得点1.5倍</b>'
               : `先攻は ${escapeHtml(C.players[C.order[0]].name)}`}
      </div>
    </div>
    <button class="btn gold" style="margin-top:18px" onclick="craftPass()">はじめる</button>`;
}

function craftPass(){
  const p = C.players[curPlayer()];
  $("stage").innerHTML = `
    <div class="verdict">
      <div class="sect-label">画面を渡して</div>
      <div class="pass-name">${escapeHtml(p.name)}</div>
      <div class="topic-note">決め台詞：<b style="color:var(--gold)">${C.tech.t}</b></div>
    </div>
    <button class="btn gold" style="margin-top:18px" onclick="craftHand()">${escapeHtml(p.name)}です</button>`;
}

function craftHand(){
  C.deck = shuffle(CARDS);
  C.hand = C.deck.splice(0, 10);
  ["呼","飾","命"].forEach(k => {
    if(C.hand.some(c => c.k === k)) return;
    const idx = C.deck.findIndex(c => c.k === k);
    if(idx < 0) return;
    C.deck.push(C.hand.pop());
    C.hand.push(C.deck.splice(idx, 1)[0]);
  });
  C.hand = shuffle(C.hand);
  C.discard = [];
  C.chosen  = [];
  C.draws   = 0;
  craftRenderDraw();
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---- 引き直し（3回まで・粘るほど威力が落ちる） ---- */
function craftRenderDraw(){
  const p = C.players[curPlayer()];
  const n = C.discard.length;
  $("stage").innerHTML = `
    <div class="sect-label">${escapeHtml(p.name)}／決め台詞：${C.tech.t}</div>
    <div class="draw-note">
      いらない札を選んで引き直せる。<b>あと ${MAX_DRAWS - C.draws} 回</b>。<br>
      いまの威力は <b>×${curMult().toFixed(1)}</b>${C.draws < MAX_DRAWS
        ? `　／　引き直すと <b>×${DRAW_MULT[C.draws+1].toFixed(1)}</b>` : ""}
    </div>
    <div class="hand">${C.hand.map((c,i)=>{
      const off = C.discard.includes(i);
      return `<button class="wcard ${off?'tossed':''}" onclick="craftToss(${i})">
        <span class="card-top"><span class="card-k k${c.k}">${c.k}</span><span class="card-p">${"◆".repeat(c.p)}</span></span>
        <span class="card-t">${c.t}</span>
        <span class="card-r">${c.r}</span>
      </button>`;}).join("")}</div>
    <div class="opt-row">
      <button class="btn ghost" onclick="craftKeepAll()">このまま組む</button>
      <button class="btn gold" ${n?"":"disabled"} onclick="craftRedraw()">${n}枚 引き直す（×${DRAW_MULT[C.draws+1].toFixed(1)}）</button>
    </div>`;
}
function craftToss(i){
  const at = C.discard.indexOf(i);
  if(at >= 0) C.discard.splice(at, 1); else C.discard.push(i);
  craftRenderDraw();
}
function craftKeepAll(){ C.discard = []; craftRenderHand(); }
function craftRedraw(){
  const keep = C.hand.filter((_,i)=>!C.discard.includes(i));
  const need = C.hand.length - keep.length;
  C.hand = shuffle([...keep, ...C.deck.splice(0, need)]);
  C.discard = [];
  C.draws++;
  beep(620,.09); setTimeout(()=>beep(880,.14),70);
  if(C.draws >= MAX_DRAWS) return craftRenderHand();
  craftRenderDraw();
}

function craftRenderHand(){
  const p = C.players[curPlayer()];
  const line = C.chosen.map(i=>C.hand[i].t).join("、");
  const raw  = C.chosen.reduce((s,i)=>s+C.hand[i].p, 0);
  const full = C.chosen.length >= MAX_PICK;
  $("stage").innerHTML = `
    <div class="sect-label">${escapeHtml(p.name)}／決め台詞：${C.tech.t}</div>
    <div class="craft-line">${line
      ? `${line}<span class="tech-tail"> ── ${C.tech.t}！</span>`
      : "<span style='opacity:.4'>使いたい札を、唱える順に選べ</span>"}</div>
    <div class="craft-meta">${C.chosen.length} / ${MAX_PICK}枚　威力 ${raw*3}${
      C.draws ? ` × ${curMult().toFixed(1)} = <b style="color:var(--gold)">${Math.round(raw*3*curMult())}</b>`
              : ` <b style="color:var(--gold)">点</b>`}</div>
    <div class="hand">${C.hand.map((c,i)=>{
      const at = C.chosen.indexOf(i);
      const dim = at < 0 && full;
      return `<button class="wcard ${at>=0?'picked':''} ${dim?'tossed':''}" onclick="craftPick(${i})">
        <span class="card-top"><span class="card-k k${c.k}">${c.k}</span><span class="card-p">${"◆".repeat(c.p)}</span></span>
        <span class="card-t">${c.t}</span>
        <span class="card-r">${c.r}</span>
        ${at>=0?`<span class="card-no">${at+1}</span>`:""}
      </button>`;}).join("")}</div>
    <div class="opt-row">
      <button class="btn ghost" onclick="C.chosen=[];craftRenderHand()">選び直す</button>
      <button class="btn gold" ${C.chosen.length?"":"disabled"} onclick="craftChant()">唱える</button>
    </div>`;
}
function craftPick(i){
  const at = C.chosen.indexOf(i);
  if(at >= 0) C.chosen.splice(at, 1);
  else if(C.chosen.length < MAX_PICK) C.chosen.push(i);
  craftRenderHand();
}

function craftChant(){
  if(!C.chosen.length) return;
  const cards = C.chosen.map(i=>C.hand[i]);
  const spell = {
    text: cards.map(c=>c.t).join("、") + " ── " + C.tech.t + "！",
    read: cards.map(c=>c.r).join("、") + "、" + C.tech.r,
    alt : [],
  };
  const mult = curMult();
  G.chantDone = res => craftAfterChant(res, spell, cards, mult, C.draws);
  startChant(spell);
}

function craftAfterChant(res, spell, cards, mult, draws){
  const all    = [...cards, C.tech];              // 最後の要素が決め台詞
  const landAll = landedCards(res.heard, all);
  const land   = landAll.slice(0, cards.length);
  const finish = landAll[cards.length];            // 技名を言い切れたか
  const nLand  = land.filter(Boolean).length;
  const power = cards.reduce((s,c,i)=> s + (land[i] ? c.p : 0), 0);   // 落とした札は数えない
  const pts   = Math.round(power * 3 * mult);
  const chant = Math.round(30 * nLand / cards.length);
  const full  = nLand === cards.length && finish;   // 技名まで言い切って完唱
  const bonus = full ? 20 : 0;
  const fin   = finish ? 15 : 0;                    // 決め台詞ボーナス
  // 技名まで言えて初めて「唱え切った」。札だけ揃っても締められなければ決まらない
  const label = full ? "唱え切った"
              : (nLand === cards.length && !finish) ? "決め台詞を落とした"
              : nLand >= cards.length/2 ? "半端な詠唱" : "ほとんど落とした";
  const cls   = full ? "v-crit"
              : nLand >= cards.length/2 ? "v-weak" : "v-fail";

  C.entries.push({ pi:curPlayer(), text:spell.text, chant, mult, draws, pts, bonus, fin, finish,
                   nLand, nCards:cards.length, votes:0 });

  $("stage").innerHTML = `
    <div class="verdict">
      <div class="v-title ${cls}">${label}</div>
      <div class="v-dmg ${cls} mono-num">${nLand} / ${cards.length}</div>
      <div class="land-list">${cards.map((c,i)=>
        `<span class="land ${land[i]?'ok':'ng'}">${land[i]?"":"✕ "}${c.t}</span>`).join("")}
        <span class="land tech ${finish?'ok':'ng'}">${finish?"":"✕ "}${C.tech.t}</span></div>
      <div class="acc-row"><span>詠唱</span><span style="flex:1"></span><span class="mono-num">${chant} 点</span></div>
      <div class="acc-row"><span>威力（唱えた札のみ）</span><span style="flex:1"></span>
        <span class="mono-num">${draws ? `${power*3} × ${mult.toFixed(1)} = ${pts}` : pts} 点</span></div>
      <div class="acc-row"><span>決め台詞</span><span style="flex:1"></span>
        <span class="mono-num" style="color:${finish?'var(--gold)':'var(--ng)'}">${finish ? "+15" : "0"} 点</span></div>
      ${full ? `<div class="acc-row"><span style="color:var(--gold)">完唱ボーナス</span><span style="flex:1"></span>
        <span class="mono-num" style="color:var(--gold)">+${bonus} 点</span></div>` : ""}
      <div class="v-heard">聞こえた言葉：<b>${escapeHtml(res.heard.trim() || "（聞き取れなかった）")}</b></div>
    </div>
    <button class="btn gold" style="margin-top:16px" onclick="craftNextTurn()">つぎの人へ</button>`;
}

function craftNextTurn(){
  C.turn++;
  if(C.turn < C.players.length) return craftPass();
  C.voter = 0;
  craftVotePass();
}

function craftVotePass(){
  const p = C.players[C.order[C.voter]];
  $("stage").innerHTML = `
    <div class="verdict">
      <div class="sect-label">投票 ── 画面を渡して</div>
      <div class="pass-name">${escapeHtml(p.name)}</div>
      <div class="topic-note">決め台詞：<b style="color:var(--gold)">${C.tech.t}</b></div>
    </div>
    <button class="btn gold" style="margin-top:18px" onclick="craftVote()">${escapeHtml(p.name)}です</button>`;
}
function craftVote(){
  const me = C.order[C.voter];
  $("stage").innerHTML = `
    <div class="sect-label">${escapeHtml(C.players[me].name)}／「${C.tech.t}」に一番ふさわしかったのは？</div>
    ${C.entries.map((e,i)=>`
      <button class="spell-pick" ${e.pi===me?"disabled style='opacity:.35'":""} onclick="craftCastVote(${i})">
        <div class="sp-head"><span class="sp-rank r2">${escapeHtml(C.players[e.pi].name)}</span>
        ${e.pi===me?'<span class="sp-dmg">自分には入れられない</span>':''}</div>
        <div class="sp-text">${e.text}</div>
      </button>`).join("")}`;
}
function craftCastVote(i){
  if(C.entries[i].pi === C.order[C.voter]) return;
  C.entries[i].votes++;
  beep(760,.12);
  C.voter++;
  if(C.voter < C.players.length) return craftVotePass();
  craftRoundResult();
}

function craftRoundResult(){
  const last      = C.round === C.rounds;
  const roundMult = last ? 1.5 : 1;
  const allVotes  = C.players.length - 1;          // 自分以外の全員ぶん
  C.entries.forEach(e=>{
    e.uni   = e.votes >= allVotes && allVotes >= 2;
    e.total = Math.round((e.chant + e.pts + e.bonus + e.fin + e.votes*25 + (e.uni ? 25 : 0)) * roundMult);
    C.players[e.pi].score += e.total;
  });
  const ranked = C.entries.slice().sort((a,b)=>b.total-a.total);
  $("stage").innerHTML = `
    <div class="sect-label">第 ${C.round} 幕の結果 ── ${C.tech.t}${last ? "　／ 終幕 ×1.5" : ""}</div>
    ${ranked.map((e,i)=>`
      <div class="res-row ${i===0?'top':''}">
        <div class="res-head">
          <span class="res-name">${i===0?"👑 ":""}${escapeHtml(C.players[e.pi].name)}</span>
          <span class="res-total mono-num">${e.total}</span>
        </div>
        <div class="res-spell">${e.text}</div>
        <div class="res-break">詠唱 ${e.chant}（${e.nLand}/${e.nCards}枚）${e.finish?"　決め台詞 +15":"　決め台詞 ✕"}${e.bonus?"　完唱 +20":""}　威力 ${e.pts}${
          e.draws?`（引直${e.draws}回 ×${e.mult.toFixed(1)}）`:""}</div>
        <div class="res-break">票 ${e.votes}×25${e.uni?"　満場一致 +25":""}${last?"　→ 合計×1.5":""}</div>
      </div>`).join("")}
    <button class="btn gold" style="margin-top:14px" onclick="${last ? "craftFinal()" : "craftRound()"}">
      ${last ? "総合結果" : "つぎの幕へ"}</button>`;
}

function craftFinal(){
  const ranked = C.players.slice().sort((a,b)=>b.score-a.score);
  $("battle").classList.add("hide");
  $("over").classList.remove("hide");
  $("ovEmoji").textContent = "👑";
  $("ovTitle").textContent = "大詠唱者";
  $("ovSub").innerHTML = `${escapeHtml(ranked[0].name)} が最も心を動かした`;
  const slot = $("over").querySelector(".stats") || $("over").querySelector(".final-list");
  slot.outerHTML = `
    <div class="final-list">${ranked.map((p,i)=>`
      <div class="res-row ${i===0?'top':''}">
        <div class="res-head">
          <span class="res-name">${["🥇","🥈","🥉"][i] || "　"} ${escapeHtml(p.name)}</span>
          <span class="res-total mono-num">${p.score}</span>
        </div>
      </div>`).join("")}</div>`;
}

function gameOver(win, msg){
  stopSpeech();
  $("battle").classList.add("hide");
  $("over").classList.remove("hide");
  $("ovEmoji").textContent = win ? "🏆" : "💀";
  if(G.mode === "duel"){
    $("ovTitle").textContent = "決　着";
    $("ovSub").textContent = msg;
  }else if(win){
    $("ovTitle").textContent = "試練踏破";
    $("ovSub").innerHTML = "3体の魔物を退けた。<br>ギルドは君を <b>大魔導士</b> と認めた。";
  }else{
    $("ovTitle").textContent = "力尽きた…";
    $("ovSub").innerHTML = `第${G.stage+1}の試練「${G.R.name}」に敗れた。<br>舌を鍛えて出直せ。`;
  }
  $("stTurns").textContent = G.stats.turns;
  $("stAcc").textContent = (G.stats.turns ? Math.round(G.stats.accSum/G.stats.turns*100) : 0) + "%";
  $("stCrit").textContent = G.stats.crit;
}
</script>
</body>
</html>
